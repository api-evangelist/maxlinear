aid: maxlinear
name: MaxLinear
description: >-
  MaxLinear, Inc. (NASDAQ: MXL) is a fabless semiconductor company headquartered
  in Carlsbad, California that designs radio-frequency (RF), high-performance
  analog, and mixed-signal communications systems-on-chip (SoCs) for critical
  network infrastructure, the connected home, and industrial and multi-market
  applications. Its products integrate RF, analog, mixed-signal, digital signal
  processing, security engines, data compression, networking, and power
  management into single chips that power cable and fiber broadband modems,
  Wi-Fi 6/7 and wireline home routers, optical transceivers, 4G/5G base-station
  and backhaul infrastructure, and high-speed data-center interconnects.
  MaxLinear exposes developer surface primarily as hardware/firmware SDKs and C
  APIs (for example the Panther Storage Acceleration SDK and the MxL890x Raw
  Acceleration API) delivered with its silicon, along with design tools,
  simulation models, and a technical documentation library — it does not publish
  a public web/REST API. This profile was surfaced as a Battery Ventures
  portfolio company and enriched from public sources.
